services:
  app:
    build: .
    image: devops-lab10:latest
    container_name: lab10-app
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: lab10-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus-lab10.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped